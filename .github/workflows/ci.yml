name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: njiw_test
          POSTGRES_USER: njiw_test
          POSTGRES_PASSWORD: njiw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U njiw_test -d njiw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://njiw_test:njiw_test@localhost:5432/njiw_test?schema=public
      NODE_ENV: test
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
