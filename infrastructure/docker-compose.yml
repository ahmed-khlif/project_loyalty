services:
  postgres:
    image: postgres:16-alpine
    container_name: njiw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-njiw_dev}
      POSTGRES_USER: ${POSTGRES_USER:-njiw_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-njiw_dev_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - njiw-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: njiw-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - njiw-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  njiw-postgres-data:
    name: njiw-postgres-data
  njiw-redis-data:
    name: njiw-redis-data
