packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.0'
  - '@nestjs/config@12.0.1'
  - '@nestjs/core@12.1.0'
  - '@nestjs/platform-express@12.1.0'
  - '@nestjs/testing@12.1.0'
